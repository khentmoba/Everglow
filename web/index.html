<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Everglow - A private digital relationship scrapbook">
  <meta name="theme-color" content="#d4a0a0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Everglow">
  <meta name="format-detection" content="telephone=no">
  <meta name="google" content="notranslate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Everglow</title>
  <link rel="manifest" href="manifest.json">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="cat_3d_engine.js"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="hls_bridge.js"></script>
</head>
<body spellcheck="false" translate="no">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          var reg = registrations[i];
          if (reg.scope && reg.scope.includes('firebase-cloud-messaging-push-scope')) continue;
          reg.unregister();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter Web sets aria-hidden="true" on platform view wrappers, which
    // causes Chrome/Brave on Android to block pointer events on the iframe
    // inside. Strip it whenever it appears so iframes stay interactive.
    new MutationObserver(function(mutations) {
      mutations.forEach(function(m) {
        if (m.attributeName === 'aria-hidden' &&
            m.target.hasAttribute('aria-hidden') &&
            m.target.tagName === 'FLT-PLATFORM-VIEW') {
          m.target.removeAttribute('aria-hidden');
        }
      });
    }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['aria-hidden'] });
  </script>
</body>
</html>
