<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Everglow - A private digital relationship scrapbook">
  <meta name="theme-color" content="#1a0f1e">
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Everglow">
  <meta name="format-detection" content="telephone=no">
  <meta name="google" content="notranslate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Everglow</title>
  <link rel="manifest" href="manifest.json">

  <!-- Early connections: Flutter + Firebase backends first (critical path).
       Media CDNs are NOT preconnected here on purpose — model-viewer/HLS
       load lazily after first frame (see __everglowEnsureMediaLibs below),
       so their DNS/TLS never delays LCP. -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firebase.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://ajax.googleapis.com">

  <!-- Bootstrap is the critical script: preload it at high priority. -->
  <link rel="preload" href="flutter_bootstrap.js" as="script" fetchpriority="high">
  <!-- main.dart.js (~6MB) always follows bootstrap: hint it early so the
       download starts in parallel instead of waiting for bootstrap to run.
       Served cache-first by sw.js on repeat visits; revalidated (304) by
       HTTP on the very first visit after a deploy. -->
  <link rel="preload" href="main.dart.js" as="script" fetchpriority="high">

  <style>
    /* Instant dark splash: avoids white flash and gives LCP feedback before
       CanvasKit/main.dart.js download + compile (the long pole on web).
       Fixed full-screen bounds prevent iOS chin gap and document scrolling. */
    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      /* iOS Home Screen apps can mis-measure %/vh around the status bar,
         leaving an empty band below the app. fill-available tracks the real
         window instead; ignored where unsupported, so browsers are unchanged. */
      min-height: -webkit-fill-available;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      background: #1a0f1e;
      color-scheme: dark;
    }

    /* Prevent hidden text-editing textarea from intercepting pointermove/touch events
       and corrupting offsetY relative to flutter-view (Chromium issue #184524) */
    flt-text-editing-host {
      pointer-events: none !important;
    }

    /* Prevent iOS Safari from auto-zooming when tapping text fields.
       Keep them selectable/editable despite body user-select:none. */
    input, textarea, select,
    flt-text-editing-host input,
    flt-text-editing-host textarea {
      font-size: 16px !important;
      -webkit-user-select: text !important;
      user-select: text !important;
    }
    #eg-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(120% 90% at 50% 0%, #2d1b33 0%, #1a0f1e 55%, #120a16 100%);
      z-index: 10;
      transition: opacity .35s ease;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #eg-splash.hide { opacity: 0; pointer-events: none; }
    #eg-splash .eg-heart {
      font-size: 40px;
      line-height: 1;
      animation: eg-pulse 1.6s ease-in-out infinite;
      filter: drop-shadow(0 4px 18px rgba(194, 24, 91, .45));
    }
    #eg-splash .eg-title {
      color: #fff5f5;
      font-size: 15px;
      letter-spacing: .28em;
      text-transform: uppercase;
      opacity: .9;
    }
    #eg-splash .eg-sub {
      color: rgba(244, 194, 194, .65);
      font-size: 12px;
      letter-spacing: .08em;
    }
    #eg-splash .eg-bar {
      width: 168px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .12);
      overflow: hidden;
    }
    #eg-splash .eg-bar > div {
      height: 100%;
      width: 38%;
      border-radius: inherit;
      background: linear-gradient(90deg, #c2185b, #f4c2c2);
      animation: eg-slide 1.1s ease-in-out infinite alternate;
    }
    @keyframes eg-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes eg-slide { from { transform: translateX(-60%); } to { transform: translateX(280%); } }
    @media (prefers-reduced-motion: reduce) {
      #eg-splash .eg-heart, #eg-splash .eg-bar > div { animation: none; }
    }
    /* Installed-web-app only (Add to Home Screen): keep the splash copy
       clear of the iPhone status bar and home indicator. Plain Safari tabs
       never match this query, so browser rendering is untouched. */
    @media (display-mode: standalone) {
      #eg-splash {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
  </style>
  <script>
    // Chrome deprecated the non-standard Intl.v8BreakIterator in favor of Intl.Segmenter.
    // Clean up window.Intl.v8BreakIterator so Flutter Web never attempts to instantiate it,
    // avoiding DevTools deprecation warnings.
    try {
      if (typeof window !== 'undefined' && window.Intl) {
        delete window.Intl.v8BreakIterator;
      }
    } catch (_) {
      try { window.Intl.v8BreakIterator = undefined; } catch (__) {}
    }

    // Filter known external library/CanvasKit informational console noise:
    (function () {
      var origWarn = console.warn;
      console.warn = function () {
        if (arguments.length > 0 && typeof arguments[0] === 'string') {
          if (arguments[0].indexOf('Could not find a set of Noto fonts') !== -1) return;
        }
        return origWarn.apply(console, arguments);
      };
      var origLog = console.log;
      console.log = function () {
        if (arguments.length > 0 && typeof arguments[0] === 'string') {
          if (arguments[0].indexOf('Could not find a set of Noto fonts') !== -1) return;
        }
        return origLog.apply(console, arguments);
      };
      var origInfo = console.info;
      console.info = function () {
        if (arguments.length > 0 && typeof arguments[0] === 'string') {
          if (arguments[0].indexOf('Could not find a set of Noto fonts') !== -1) return;
        }
        return origInfo.apply(console, arguments);
      };
      var origError = console.error;
      console.error = function () {
        if (arguments.length > 0 && typeof arguments[0] === 'string') {
          if (arguments[0].indexOf('Could not find a set of Noto fonts') !== -1) return;
        }
        return origError.apply(console, arguments);
      };
    })();
  </script>

  <script>
    // Enforce viewport meta tag against Flutter Web's FullPageEmbeddingStrategy:
    // Flutter replaces index.html's viewport tag with maximum-scale=5.0 and drops
    // user-scalable=no & viewport-fit=cover, which causes accidental zoom & layout
    // stretching on mobile devices. This observer guarantees the tag stays locked.
    // If the engine ever measures a viewport WITHOUT cover (e.g. it boots in the
    // gap between Flutter's replacement and our restore), its canvas stays short
    // and the Home Screen app shows an empty dark band at the bottom. The resize
    // nudge below makes the engine re-measure the true full window in that case.
    (function () {
      var expected = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
      var resizeQueued = false;
      function nudgeEngine() {
        if (resizeQueued) return;
        resizeQueued = true;
        setTimeout(function () {
          resizeQueued = false;
          try { window.dispatchEvent(new Event('resize')); } catch (_) {}
        }, 100);
      }
      function lockMeta() {
        var fixed = false;
        var metas = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < metas.length; i++) {
          if (metas[i].getAttribute('content') !== expected) {
            metas[i].setAttribute('content', expected);
            fixed = true;
          }
        }
        if (metas.length === 0 && document.head) {
          var m = document.createElement('meta');
          m.name = 'viewport';
          m.content = expected;
          document.head.appendChild(m);
          fixed = true;
        }
        if (fixed) nudgeEngine();
      }
      lockMeta();
      if (typeof MutationObserver !== 'undefined') {
        new MutationObserver(lockMeta).observe(document.head || document.documentElement, {
          childList: true,
          attributes: true,
          attributeFilter: ['content']
        });
      }
      // Re-assert once the engine is up: heals an early measurement taken
      // before cover was restored. One extra layout during splash fade.
      window.addEventListener('flutter-first-frame', function () {
        lockMeta();
        nudgeEngine();
      }, { once: true });
    })();

    // Active scroll guardian: keeps document window at (0, 0) scroll offset
    // so Flutter Web's computeEventOffsetToTarget never suffers downward tap offset.
    (function () {
      function resetScroll() {
        if (window.scrollX !== 0 || window.scrollY !== 0) {
          window.scrollTo(0, 0);
        }
        if (document.documentElement) {
          if (document.documentElement.scrollTop !== 0) document.documentElement.scrollTop = 0;
          if (document.documentElement.scrollLeft !== 0) document.documentElement.scrollLeft = 0;
        }
        if (document.body) {
          if (document.body.scrollTop !== 0) document.body.scrollTop = 0;
          if (document.body.scrollLeft !== 0) document.body.scrollLeft = 0;
        }
      }

      window.addEventListener('scroll', resetScroll, { passive: true });
      window.addEventListener('resize', resetScroll, { passive: true });
      window.addEventListener('orientationchange', resetScroll, { passive: true });
      window.addEventListener('pointerdown', resetScroll, { capture: true, passive: true });
      window.addEventListener('touchstart', resetScroll, { capture: true, passive: true });

      // When virtual keyboard dismisses on iOS/Android:
      window.addEventListener('focusout', function () {
        resetScroll();
        setTimeout(resetScroll, 50);
        setTimeout(resetScroll, 200);
        setTimeout(resetScroll, 400);
      }, { passive: true });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('scroll', resetScroll, { passive: true });
        window.visualViewport.addEventListener('resize', resetScroll, { passive: true });
      }

      // Prevent multi-finger pinch-zoom on iOS Safari:
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });
    })();
  </script>

  <script>
    // Installed-web-app inset bridge (Add to Home Screen, standalone only).
    // With viewport-fit=cover the standalone view stretches under the iPhone
    // status bar, while Flutter's SafeArea reports zero padding on web — so
    // Dart measures env(safe-area-inset-top) and pads content below the bar.
    // Plain Safari tabs return 0/false here, leaving browser layout alone.
    (function () {
      function isStandalone() {
        try {
          if (window.matchMedia('(display-mode: standalone)').matches) return true;
          if (window.matchMedia('(display-mode: fullscreen)').matches) return true;
        } catch (_) {}
        try { if (window.navigator.standalone === true) return true; } catch (_) {}
        return false;
      }
      function readTopInset() {
        try {
          var probe = document.createElement('div');
          probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;' +
            'padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none;';
          document.documentElement.appendChild(probe);
          var raw = window.getComputedStyle(probe).paddingTop || '0px';
          probe.remove();
          var v = parseFloat(raw);
          if (isFinite(v) && v >= 0 && v < 200) return v;
        } catch (_) {}
        return 0;
      }
      function publish() {
        try {
          var top = isStandalone() ? readTopInset() : 0;
          document.documentElement.style.setProperty('--eg-sat', top + 'px');
          document.documentElement.classList.toggle('eg-standalone', isStandalone());
        } catch (_) {}
      }
      window.__everglowIsStandalone = isStandalone;
      window.__everglowSafeAreaTop = function () {
        try { return isStandalone() ? readTopInset() : 0; } catch (_) { return 0; }
      };
      window.addEventListener('resize', publish, { passive: true });
      window.addEventListener('orientationchange', publish, { passive: true });
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', publish);
      } else {
        publish();
      }
      setTimeout(publish, 500);
    })();
  </script>

</head>
<body spellcheck="false" translate="no">
  <div id="eg-splash" aria-hidden="true">
    <div class="eg-heart">💗</div>
    <div class="eg-title">Everglow</div>
    <div class="eg-bar"><div></div></div>
    <div class="eg-sub">loading your story…</div>
  </div>
  <script>
    // Dismiss the splash on Flutter's first frame; fallback timeout keeps it
    // from sticking if the event is missed (slow CDN, adblock, etc.).
    (function () {
      var done = false;
      function hide() {
        if (done) return;
        done = true;
        var el = document.getElementById('eg-splash');
        if (el) {
          el.classList.add('hide');
          setTimeout(function () { el.remove(); }, 450);
        }
      }
      window.addEventListener('flutter-first-frame', hide);
      // Safety net: never trap the user behind the splash.
      setTimeout(hide, 12000);
    })();
  </script>
  <script>
    // Lazy media libs: <model-viewer> and hls.js used to load
    // in <head> on EVERY visit (2 CDN round-trips + parse before first paint)
    // even though they are only needed deep in the app (guardian 3D,
    // cinema/watch-party video). Now they load once, after first
    // frame or on explicit demand from Dart via JS interop:
    //   __everglowEnsureMediaLibs() / __everglowWhenHlsReady()
    window.__everglowMediaState = window.__everglowMediaState || {
      loaded: false, loading: null, hlsReady: null
    };
    window.__everglowEnsureMediaLibs = function () {
      var st = window.__everglowMediaState;
      if (st.loaded) return Promise.resolve();
      if (st.loading) return st.loading;
      function loadScript(src, opts) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          if (opts && opts.type) s.type = opts.type;
          if (opts && opts.defer) s.defer = true;
          s.onload = function () { resolve(); };
          s.onerror = function () { reject(new Error('media lib failed: ' + src)); };
          document.head.appendChild(s);
        });
      }
      st.loading = (async function () {
        // Order matters: hls.js before the local bridge that wraps it.
        await loadScript('https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js');
        await loadScript('hls_bridge.js', { defer: true });
        await loadScript(
          'https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js',
          { type: 'module' }
        );
        st.loaded = true;
      })().catch(function (e) {
        // Never reject permanently: allow a later retry (offline -> online).
        st.loading = null;
        throw e;
      });
      return st.loading;
    };
    window.__everglowWhenHlsReady = function () {
      return window.__everglowEnsureMediaLibs().then(function () {
        return !!(window.Hls || (window.__everglowHlsBridgeReady === true));
      }).catch(function () { return false; });
    };
    function __everglowIdleLoadMedia() {
      var kick = function () {
        try {
          var p = window.__everglowEnsureMediaLibs();
          if (p && p.catch) p.catch(function () {});
        } catch (e) {}
      };
      if ('requestIdleCallback' in window) {
        requestIdleCallback(kick, { timeout: 4000 });
      } else {
        setTimeout(kick, 2500);
      }
    }
    window.addEventListener('flutter-first-frame', __everglowIdleLoadMedia, { once: true });
    // Fallback if the event is missed.
    setTimeout(function () {
      if (!window.__everglowMediaState.loaded && !window.__everglowMediaState.loading) {
        __everglowIdleLoadMedia();
      }
    }, 9000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Auto-update helper (called from Dart's AppUpdateService via JS interop).
    // True while a native <video> is mid-playback, so the auto-reload never
    // interrupts movie night. Cross-origin iframes (trailers/embeds) can't
    // be inspected — those tabs still get the banner plus the background
    // auto-switch when the tab is hidden.
    window.__everglowAnyVideoPlaying = function () {
      try {
        var videos = document.querySelectorAll('video');
        for (var i = 0; i < videos.length; i++) {
          var v = videos[i];
          if (!v.paused && !v.ended && v.currentTime > 0) return true;
        }
      } catch (e) {}
      return false;
    };
  </script>
  <script>
    // App service worker (web/sw.js, generated by tool/generate_sw.dart):
    // cache-first shell + immutable assets so repeat visits skip the
    // main.dart.js + CanvasKit WASM downloads. Registered on page load so
    // the install precache never competes with first paint. The old
    // Flutter shim worker is gone (see web/flutter_bootstrap.js), so
    // nothing here unregisters this — same-scope registration also
    // replaces any worker left over from older deploys.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function (e) {
          console.warn('[Everglow] service worker registration failed:', e);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async fetchpriority="high"></script>
  <script>
    // Flutter Web sets aria-hidden="true" on platform view wrappers, which
    // causes Chrome/Brave on Android to block pointer events on the iframe
    // inside. Strip it whenever it appears so iframes stay interactive.
    // Throttled via microtask coalescing: the naive per-mutation version ran
    // once per attribute change during heavy scroll/video and showed up in
    // traces. This version batches a mutation burst into one pass.
    (function () {
      var scheduled = false;
      function sweep() {
        scheduled = false;
        try {
          var nodes = document.querySelectorAll('flt-platform-view[aria-hidden]');
          for (var i = 0; i < nodes.length; i++) {
            nodes[i].removeAttribute('aria-hidden');
          }
        } catch (e) {}
      }
      new MutationObserver(function () {
        if (scheduled) return;
        scheduled = true;
        // queueMicrotask keeps the fix inside the same frame; rAF fallback
        // covers browsers without queueMicrotask.
        if (typeof queueMicrotask === 'function') queueMicrotask(sweep);
        else requestAnimationFrame(sweep);
      }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['aria-hidden'] });
    })();
  </script>
</body>
