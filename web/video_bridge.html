<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#000;overflow:hidden">
  <video id="v" style="width:100%;height:100%;display:none" playsinline></video>
  <div id="loading" style="color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif">Loading...</div>
<script>
const v = document.getElementById('v');
const loading = document.getElementById('loading');

function post(type, data) {
  window.parent.postMessage({type, ...data}, '*');
}

v.addEventListener('loadedmetadata', () => {
  loading.style.display = 'none';
  v.style.display = 'block';
  post('ready', {duration: v.duration});
});

v.addEventListener('timeupdate', () => {
  post('time', {currentTime: v.currentTime, paused: v.paused});
});

v.addEventListener('play', () => post('play', {currentTime: v.currentTime}));
v.addEventListener('pause', () => post('pause', {currentTime: v.currentTime}));
v.addEventListener('seeked', () => post('seeked', {currentTime: v.currentTime}));
v.addEventListener('error', () => post('error', {msg: 'Video load failed'}));
v.addEventListener('ended', () => post('ended', {}));

window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || !d.type) return;
  try {
    switch (d.type) {
      case 'load':
        if (d.url) {
          v.src = d.url;
          v.load();
          loading.style.display = 'flex';
          v.style.display = 'none';
        } else if (d.provider && d.id) {
          const iframe = document.createElement('iframe');
          iframe.allow = 'autoplay;fullscreen;encrypted-media';
          const base = d.provider === 'vidlink'
            ? 'https://vidlink.pro/' + d.mediaType + '/' + d.id
            : 'https://vidsrc.to/embed/' + d.mediaType + '/' + d.id;
          iframe.src = base + (d.season ? '/' + d.season + '/' + d.episode : '') + '?autoplay=true';
          iframe.style.cssText = 'width:100%;height:100%;border:0;position:absolute;top:0;left:0';
          document.body.appendChild(iframe);
          v.style.display = 'none';
          loading.style.display = 'none';
          post('fallback', {msg: 'Using provider embed'});
        }
        break;
      case 'play': v.play().catch(() => post('error', {msg: 'Autoplay blocked'})); break;
      case 'pause': v.pause(); break;
      case 'seek': if (d.time != null) v.currentTime = d.time; break;
      case 'mute': v.muted = true; break;
      case 'unmute': v.muted = false; break;
    }
  } catch (err) { post('error', {msg: err.message}); }
});

post('bridge_ready', {});
</script>
</body>
</html>
