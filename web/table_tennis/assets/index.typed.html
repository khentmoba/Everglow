<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="initial-scale=1.0,maximum-scale=1.01,minimal-ui">
<meta name="robots" content="noindex, nofollow">
<title>Table Tennis World Tour — Typed</title>
<link rel="stylesheet" href="css/play.css">
<style>
  body { margin:0; padding:0; width:100%; overflow:hidden; background:#000; }
  canvas { -ms-touch-action:none; image-rendering:-o-crisp-edges; image-rendering:optimize-contrast; -ms-interpolation-mode:nearest-neighbor; -webkit-tap-highlight-color:rgba(0,0,0,0); user-select:none; -webkit-touch-callout:none; -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; }
</style>
</head>
<body>
<div id="canvas-wrapper" style="overflow:hidden;width:100%;height:100%;margin:0;padding:0;position:absolute;">
  <canvas id="canvas" moz-opaque></canvas>
</div>
<!-- deps still loaded as globals (Howler, TweenMax) -->
<script src="js/TweenMax.min.js"></script>
<script src="js/Howler.min.js"></script>
<script src="js/VisibilityManager.js"></script>
<script src="js/famobi-stub.js"></script>
<script>window.famobi_gameID="table-tennis-world-tour";window.famobi_gameJS=["TweenMax.min.js","Howler.min.js","VisibilityManager.js","app37.js",function(){extGameLoad()}];</script>
<!-- single typed bundle — fully reverse engineered, no legacy fallback -->
<script src="js/dist/bundle.js"></script>
<script>
  extGameLoad();
  if (typeof resizeCanvas === 'function') resizeCanvas();
</script>
</body>
</html>
