name: Deploy streaming Worker

# A merge to main is the only way the Worker reaches Clair. Nobody runs
# `wrangler deploy` by hand, so the live Worker always matches main.
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'functions/hls_player.js'
      - '.github/workflows/deploy_worker.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy halfway; a newer push waits its turn.
concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
      # Same runner, same minute as the after-check: region quirks and upstream
      # outages show on both sides and become warnings, not failures.
      - name: Smoke the live Worker before deploying
        run: node scripts/smoke.mjs --url https://everglow-stream.khentplaysmoba.workers.dev --save "$RUNNER_TEMP/smoke-before.json"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (cloudflare/README.md, Deploy)."
            exit 1
          fi
          npx wrangler deploy --message "main ${GITHUB_SHA::7}"
      # Red only when this deploy broke something that played a minute ago,
      # or added a server row that plays nothing.
      - name: Smoke the live Worker after deploying
        run: node scripts/smoke.mjs --url https://everglow-stream.khentplaysmoba.workers.dev --compare "$RUNNER_TEMP/smoke-before.json"
