name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate cache-busting service worker
        run: dart tool/generate_sw.dart

      - name: Build web
        run: flutter build web --release

      - name: Setup Firebase credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EVERGLOW_1C6DB }}' > "$HOME/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-key.json" >> "$GITHUB_ENV"

      - name: Install and run Firebase deploy
        run: |
          npm install -g firebase-tools@15.22.2
          firebase deploy --only hosting --project everglow-1c6db
