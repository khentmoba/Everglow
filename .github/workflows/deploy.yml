name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate cache-busting service worker
        run: dart tool/generate_sw.dart

      - name: Build web
        run: flutter build web --release

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EVERGLOW_1C6DB }}'

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@13.30.0 deploy --only hosting --project everglow-1c6db
