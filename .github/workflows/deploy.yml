name: Deploy to Firebase Hosting & Cloud Functions

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate cache-busting service worker
        run: dart tool/generate_sw.dart

      - name: Build web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EVERGLOW_1C6DB }}
          channelId: live
          projectId: everglow-1c6db
        continue-on-error: true

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        working-directory: functions
        run: npm install

      - name: Deploy Cloud Functions & Firestore Rules
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EVERGLOW_1C6DB }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME"/firebase-sa.json
          GOOGLE_APPLICATION_CREDENTIALS="$HOME"/firebase-sa.json \
          firebase deploy --only functions,firestore:rules,storage --project everglow-1c6db

      - name: Verify site is live
        run: |
          echo "Checking deployment..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://everglow-1c6db.web.app")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Site is live!"
          else
            echo "⚠️ Unexpected status: $HTTP_CODE"
          fi
