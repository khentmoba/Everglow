name: Keepawake

# Render's free tier sleeps after 15 minutes idle, and a cold Anivexa
# backend alone burns our whole 40s resolve budget — so the Anivexa
# server would never win. This pings it every 10 minutes to keep it
# warm. Personal-use traffic only; delete if Anivexa moves off Render.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s -m 30 -o /dev/null -w "ani-map:%{http_code}\n" https://everglow-ani-map.onrender.com/
