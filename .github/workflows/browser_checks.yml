name: Manual browser checks

# Explicitly requested evidence; never starts on an ordinary PR update.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Browser checks to run
        type: choice
        options: [all, shell, smoke]
        default: all

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm --prefix react ci
      - run: npm --prefix react run build
      - if: inputs.suite == 'all' || inputs.suite == 'shell'
        run: npm --prefix react test
      - if: inputs.suite == 'all' || inputs.suite == 'smoke'
        run: node tool/agent_smoke.mjs react/dist
