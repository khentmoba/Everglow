name: Quality

on:
  pull_request:
    # Body edits and draft toggles only re-run pr_contract.yml.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      app: ${{ steps.select.outputs.app }}
      browser: ${{ steps.select.outputs.browser }}
      web: ${{ steps.select.outputs.web }}
      backend: ${{ steps.select.outputs.backend }}
      security: ${{ steps.select.outputs.security }}
      audit: ${{ steps.select.outputs.audit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tool/ci/changes.test.mjs tool/ci/deploy_parity.test.mjs tool/ci/run_checks.test.mjs
      - run: node --test tool/ci/pr_contract.test.mjs tool/remove_worktree.test.mjs tool/capture_proof.test.mjs
      # The verify gate's rules, tested without the pi runtime.
      - name: Verify gate rules
        run: >-
          node --experimental-strip-types --test
          .pi/extensions/everglow_verify_gate/rules.test.ts
      # Every PR runs the Worker's tests: a merge deploys it (deploy_worker.yml).
      - name: Streaming Worker tests
        run: node --test "cloudflare/src/*.test.js" "cloudflare/scripts/*.test.mjs"
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tool/ci/changes.mjs

  web_build:
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react/package-lock.json
      - working-directory: react
        run: npm ci
      - working-directory: react
        run: npm run typecheck
      - working-directory: react
        run: npm run lint
      - name: Build web
        env:
          VITE_FCM_VAPID_KEY: ${{ secrets.FCM_VAPID_KEY }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        working-directory: react
        run: npm run build
      - name: Regression guards (including docs/release consistency)
        run: node tool/ci/run_checks.mjs
      - name: React shell & offline SW tests
        if: needs.changes.outputs.browser == 'true' || needs.changes.outputs.web == 'true'
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        working-directory: react
        run: npm test
      - name: Smoke-test every agent destination in the release app
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.browser == 'true'
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: |
          "$CHROME_PATH" --version
          node tool/agent_smoke.mjs react/dist
          node --test tool/ci/agent_smoke.test.mjs

  functions:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - if: needs.changes.outputs.backend == 'true'
        working-directory: functions
        run: npm ci
      # Shared with production: includes audit on every PR, even frontend/docs.
      - working-directory: functions
        run: npm run verify
      - if: needs.changes.outputs.security == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test couple privacy rules in emulators
        if: needs.changes.outputs.security == 'true'
        run: >-
          npx --yes firebase-tools@15 emulators:exec --only firestore,storage
          --config firebase.emulators.json --project demo-everglow
          "node --test functions/security_rules.emulator.test.js"
