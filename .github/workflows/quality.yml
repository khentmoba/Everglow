name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      preview:
        description: Publish this branch's successful web build as a temporary preview
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      app: ${{ steps.select.outputs.app }}
      browser: ${{ steps.select.outputs.browser }}
      web: ${{ steps.select.outputs.web }}
      backend: ${{ steps.select.outputs.backend }}
      security: ${{ steps.select.outputs.security }}
      audit: ${{ steps.select.outputs.audit }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR checkout is the merge commit; its first parent is the base.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tool/ci/changes.test.mjs
      - run: node --test tool/ci/pr_contract.test.mjs tool/remove_worktree.test.mjs
      - name: Enforce ready PR evidence and verification declarations
        if: github.event_name == 'pull_request'
        run: node tool/ci/pr_contract.mjs
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tool/ci/changes.mjs

  flutter:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: needs.changes.outputs.app == 'true'
        run: flutter pub get
      - if: needs.changes.outputs.app == 'true'
        run: flutter analyze
      # Goldens vary by platform; network-tagged tests hit external sites.
      - if: needs.changes.outputs.app == 'true'
        run: flutter test --exclude-tags="golden,network"
      - name: Regression guards (including docs/release consistency)
        run: |
          ls tool/ci/
          for guard in tool/ci/check_*.dart; do
            dart "$guard" || exit 1
          done
      # These exercise the real app's browser-only implementations.
      - if: needs.changes.outputs.browser == 'true'
        run: >-
          flutter test --platform chrome
          test/features/anime/anime_web_memory_test.dart
          test/features/anime/animex_player_web_bridge_test.dart
          test/embedded_media_web_memory_test.dart
          test/features/ai/motchi_streaming_scroll_test.dart

  web_build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: flutter pub get
      - name: Test generated service worker without Chrome
        run: node --test tool/service_worker_test.mjs
      - name: Prepare local env asset
        run: |
          if [ ! -f assets/env.txt ]; then
            echo "# CI placeholder - real values passed via --dart-define" > assets/env.txt
          fi
      - run: dart tool/generate_sw.dart
      # Preserve Preview's configuration while compiling the shared artifact once.
      - name: Build web
        env:
          FCM_VAPID_KEY: ${{ secrets.FCM_VAPID_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          BREYAN_EMAIL: ${{ secrets.BREYAN_EMAIL }}
          BREYAN_PASSWORD: ${{ secrets.BREYAN_PASSWORD }}
          OCTAGRAM_EMAIL: ${{ secrets.OCTAGRAM_EMAIL }}
          OCTAGRAM_PASSWORD: ${{ secrets.OCTAGRAM_PASSWORD }}
          BREYAN_PASSCODE: ${{ secrets.BREYAN_PASSCODE }}
          OCTAGRAM_PASSCODE: ${{ secrets.OCTAGRAM_PASSCODE }}
        run: |
          ARGS=(--release --no-source-maps)
          for KEY in FCM_VAPID_KEY SPOTIFY_CLIENT_ID BREYAN_EMAIL BREYAN_PASSWORD OCTAGRAM_EMAIL OCTAGRAM_PASSWORD BREYAN_PASSCODE OCTAGRAM_PASSCODE; do
            VAL="${!KEY}"
            if [ -n "$VAL" ]; then
              ARGS+=(--dart-define="$KEY=$VAL")
            fi
          done
          dart tool/build_web.dart -- "${ARGS[@]}"
      - name: Smoke-test every agent destination in the release app
        run: node tool/agent_smoke.mjs build/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  functions:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - if: needs.changes.outputs.backend == 'true'
        working-directory: functions
        run: npm ci
      - if: needs.changes.outputs.backend == 'true'
        working-directory: functions
        run: npm run lint -- --max-warnings=25
      - if: needs.changes.outputs.backend == 'true'
        working-directory: functions
        run: npm test
      - if: needs.changes.outputs.backend == 'true'
        working-directory: functions
        run: node eval_gate.js
      # ESLint already parses every JS module; a separate node --check is redundant.
      - if: needs.changes.outputs.audit == 'true'
        working-directory: functions
        run: npm audit --omit=dev --audit-level=moderate
      - if: needs.changes.outputs.security == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test couple privacy rules in emulators
        if: needs.changes.outputs.security == 'true'
        run: >-
          npx --yes firebase-tools@15 emulators:exec --only firestore,storage
          --config firebase.emulators.json --project demo-everglow
          "node --test functions/security_rules.emulator.test.js"

  preview:
    needs: [changes, web_build]
    if: >-
      needs.web_build.result == 'success' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.preview))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: build/web
      # Same-repo PRs only; forks have a keyless build but no deployment secrets.
      - name: Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0.9.0
        env:
          NODE_OPTIONS: '--no-warnings'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EVERGLOW_1C6DB }}
          projectId: everglow-1c6db
          channelId: pr-${{ github.event.pull_request.number || github.run_id }}
          expires: 12h
