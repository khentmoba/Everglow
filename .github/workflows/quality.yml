name: Quality

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Golden-tagged tests are excluded here, same as the deploy
      # workflow: committed PNGs render differently per platform
      # (see the @Tags(['golden']) note atop those test files).
      - run: flutter test --exclude-tags=golden

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - working-directory: functions
        run: npm ci
      - working-directory: functions
        run: npm test
      - working-directory: functions
        run: node --check index.js
      - working-directory: functions
        run: npm audit --omit=dev --audit-level=moderate
