# Release publisher: cuts a tag + GitHub Release whenever the shipped
# version changes on main.
name: Release

on:
  push:
    branches: [main]
    paths: [react/package.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version + notes from CHANGELOG
        id: meta
        run: |
          VER=$(node -p "require('./react/package.json').version")
          if ! printf '%s' "$VER" | grep -qP '^\d+\.\d+\.\d+$'; then
            echo "react/package.json version '$VER' is not X.Y.Z."
            exit 1
          fi
          if ! grep -qP "^## \\[$VER\\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$VER]' entry."
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          NICK=$(grep -oP "^## \\[$VER\\] - \\S+ - \\K.+" CHANGELOG.md | head -1)
          if [ -n "$NICK" ]; then TITLE="v$VER — $NICK"; else TITLE="v$VER"; fi
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          awk -v ver="$VER" '
            index($0, "## [" ver "]") == 1 { flag=1; next }
            /^## \[/ { flag=0 }
            flag
          ' CHANGELOG.md > notes.md
          {
            echo ''
            echo '---'
            echo '**Live Site:** https://everglow-1c6db.web.app'
          } >> notes.md
          echo "Publishing $TITLE"

      - name: Skip when already released
        id: check
        run: |
          if gh release view "v${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists; nothing to do."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag + GitHub Release
        if: steps.check.outputs.exists != 'true'
        run: |
          VER=${{ steps.meta.outputs.version }}
          if git ls-remote --tags origin "v$VER" | grep -q .; then
            echo "Tag v$VER already exists; creating the missing release only."
          else
            git tag "v$VER"
            git push origin "v$VER"
          fi
          gh release create "v$VER" \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
