name: everglow
description: "A private digital relationship scrapbook for Khent and Clair — Flutter Web + Firebase."
publish_to: 'none'

version: 6.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.1.0
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  image_picker: ^1.1.2
  image_picker_web: ^3.1.1
  intl: ^0.19.0
  provider: ^6.1.2
  age_calculator: ^1.0.0
  http: ^1.6.0
  confetti: ^0.8.0
  html_unescape: ^2.0.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.0
  marquee: ^2.3.0
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.1
  just_audio: ^0.9.41
  web: ^1.1.1
  flutter_webrtc: ^0.13.0
  flutter_html: ^3.0.0
  go_router: ^14.0.0
  pointer_interceptor: ^0.10.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/mochi_avatar.png
    - assets/images/milestones/
    - assets/data/
    - assets/google_fonts/
    - assets/audio/
    - assets/models/

  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/google_fonts/CormorantGaramond-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/CormorantGaramond-Bold.ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/google_fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/google_fonts/Outfit-Black.ttf
          weight: 900
    - family: Dancing Script
      fonts:
        - asset: assets/google_fonts/DancingScript-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/DancingScript-Bold.ttf
          weight: 700
    - family: Caveat
      fonts:
        - asset: assets/google_fonts/Caveat-Regular.ttf
          weight: 400
    - family: Bebas Neue
      fonts:
        - asset: assets/google_fonts/BebasNeue-Regular.ttf
          weight: 400
    - family: DM Sans
      fonts:
        - asset: assets/google_fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/DMSans-Bold.ttf
          weight: 700
