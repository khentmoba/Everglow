  <text x="86" y="112" fill="#e8b5c2" font-family="Verdana, sans-serif" font-size="13" letter-spacing="4">KHENT &amp; CLAIR</text>
  <text x="80" y="219" fill="#fff0e8" font-family="Georgia, 'Times New Roman', serif" font-size="94" letter-spacing="-3">Everglow</text>
  <text x="86" y="270" fill="#f1cbd2" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-style="italic">A little universe for two.</text>
  <text x="86" y="321" fill="#d5adb9" font-family="Verdana, sans-serif" font-size="14" letter-spacing="1">Our stories. Our movie nights. Our everyday magic.</text>
</svg>
