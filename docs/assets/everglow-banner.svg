<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Everglow — a little universe for two</title>
  <desc id="description">A warm rose-colored night sky, two orbiting stars, and a love letter to Khent and Clair.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1">
      <stop stop-color="#211724"/>
      <stop offset="0.55" stop-color="#362134"/>
      <stop offset="1" stop-color="#60374a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#efa6aa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#efa6aa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#night)"/>
  <ellipse cx="900" cy="240" rx="360" ry="280" fill="url(#glow)"/>
  <rect x="18" y="18" width="1164" height="364" rx="16" fill="none" stroke="#efbec5" stroke-opacity="0.16"/>
  <g fill="#f8dbcf">
    <circle cx="87" cy="85" r="2" opacity="0.6"/>
    <circle cx="345" cy="49" r="1.5" opacity="0.5"/>
    <circle cx="644" cy="83" r="2" opacity="0.6"/>
    <circle cx="734" cy="312" r="1.5" opacity="0.5"/>
    <circle cx="1090" cy="101" r="2" opacity="0.7"/>
    <circle cx="1126" cy="312" r="1.5" opacity="0.5"/>
    <circle cx="454" cy="349" r="2" opacity="0.4"/>
    <circle cx="113" cy="326" r="1.5" opacity="0.5"/>
  </g>
  <g fill="none" stroke="#efbec5" stroke-opacity="0.25">
    <ellipse cx="933" cy="202" rx="143" ry="88" transform="rotate(-30 933 202)"/>
    <ellipse cx="933" cy="202" rx="143" ry="88" transform="rotate(30 933 202)"/>
  </g>
  <g fill="#f8dbcf">
    <path d="M884 129 Q889 163 916 168 Q889 173 884 207 Q879 173 852 168 Q879 163 884 129Z"/>
    <path d="M990 213 Q994 238 1015 242 Q994 246 990 271 Q986 246 965 242 Q986 238 990 213Z" fill="#eba4b5"/>
    <circle cx="1036" cy="133" r="4"/>
    <circle cx="817" cy="268" r="3"/>
